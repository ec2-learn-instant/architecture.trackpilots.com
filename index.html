<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrackPilots Data Architecture Flow</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0d1117;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    box-sizing: border-box;
  }
  svg {
    width: 100%;
    max-width: 1760px;
    height: auto;
    display: block;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  .title { fill: #ffffff; font-size: 34px; font-weight: 700; text-anchor: middle; }
  .subtitle { fill: #8b949e; font-size: 17px; text-anchor: middle; }
  .label { fill: #8b949e; font-size: 13px; text-anchor: middle; }
  .name { fill: #ffffff; font-size: 22px; font-weight: 700; text-anchor: middle; }
  .host { fill: #94a3b8; font-size: 12px; text-anchor: middle; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip { fill: #0d1117; font-size: 17px; font-weight: 700; text-anchor: middle; }
  .db { fill: #e5e7eb; font-size: 17px; font-weight: 700; text-anchor: middle; }
  .legend { fill: #c9d1d9; font-size: 16px; }

  .svc { transition: opacity 0.5s ease; }
  [data-phase="offline"] .svc { opacity: 0.45; }

  #desk { transition: stroke 0.4s ease; }
  [data-phase="offline"] #desk { stroke: #ef4444; }

  /* Event routing lines */
  .chain path {
    fill: none;
    stroke-width: 4;
    opacity: 0.35;
    transition: opacity 0.5s ease;
  }
  [data-phase="online"] .chain path { opacity: 1; }
  [data-phase="offline"] .chain path { opacity: 0.12; }

  /* Health check arc (always faintly visible) */
  .health {
    fill: none;
    stroke: #334155;
    stroke-width: 3;
    stroke-dasharray: 8 10;
  }

  /* Local storage path, only used while offline */
  .local {
    fill: none;
    stroke: #94a3b8;
    stroke-width: 3;
  }

  /* Offline tags on desktop-related nodes, shown only in the offline phase */
  .offline-tag { font-size: 10px; font-weight: 700; fill: #f87171; text-anchor: end; opacity: 0; transition: opacity 0.4s ease; }
  [data-phase="offline"] .offline-tag { opacity: 1; }

  /* Status dots on each node */
  .dot { fill: #60a5fa; transition: fill 0.4s ease; }
  [data-phase="online"] .dot { fill: #22c55e; }
  [data-phase="offline"] .dot { fill: #ef4444; }

  /* Status banner */
  #status rect { fill: #3b82f6; transition: fill 0.4s ease; }
  [data-phase="online"] #status rect { fill: #22c55e; }
  [data-phase="offline"] #status rect { fill: #ef4444; }
  .st { opacity: 0; transition: opacity 0.3s ease; fill: #ffffff; font-size: 22px; font-weight: 700; text-anchor: middle; }
  [data-phase="check"] .st-check,
  [data-phase="online"] .st-online,
  [data-phase="offline"] .st-offline { opacity: 1; }
</style>
</head>

  const packetLayer = document.getElementById('packets');
  const byId = (id) => document.getElementById(id);

  const CYCLE = 16000;
  // Phase start times within one cycle (ms)
  const TIMELINE = [
    { phase: 'check', start: 0 },
    { phase: 'online', start: 3500 },
    { phase: 'offline', start: 9000 },
    { phase: 'online', start: 13000 }
  ];
  const SPAWN_EVERY = { check: 900, online: 650, offline: 1000 };
  const COLORS = { tracking: '#a78bfa', activity: '#f87171', screenshot: '#22d3ee', icons: '#84cc16', health: '#60a5fa', local: '#94a3b8' };
  const EVENT_TYPES = ['tracking', 'activity', 'screenshot', 'icons'];
  const ROUTES = {
    tracking: ['p-desk-api', 'p-api-rmq', 'p-rmq-track', 'p-track-db'],
    activity: ['p-desk-api', 'p-api-rmq', 'p-rmq-act', 'p-act-db'],
    screenshot: ['p-desk-api', 'p-api-rmq', 'p-rmq-shot', 'p-shot-db'],
    icons: ['p-desk-api', 'p-api-rmq', 'p-rmq-icons', 'p-icons-db']
  };
  const SEGMENT_MS = [600, 600, 800, 400];

  const packets = [];

  function launch(color, segments, r = 8) {
    const circle = document.createElementNS(NS, 'circle');
    circle.setAttribute('r', r);
    circle.setAttribute('fill', color);
    circle.setAttribute('stroke', '#0d1117');
    circle.setAttribute('stroke-width', 2);
    packetLayer.appendChild(circle);
    packets.push({ circle, segments, index: 0, start: performance.now() });
  }

  function movePackets(now) {
    for (let k = packets.length - 1; k >= 0; k--) {
      const p = packets[k];
      while (p.index < p.segments.length && now - p.start >= p.segments[p.index].dur) {
        p.start += p.segments[p.index].dur;
        p.index++;
      }
      if (p.index >= p.segments.length) {
        p.circle.remove();
        packets.splice(k, 1);
        continue;
      }
      const seg = p.segments[p.index];
      let t = (now - p.start) / seg.dur;
      if (seg.reverse) t = 1 - t;
      const len = seg.el.getTotalLength();
      const pt = seg.el.getPointAtLength(len * t);
      p.circle.setAttribute('cx', pt.x);
      p.circle.setAttribute('cy', pt.y);
    }
  }

  function eventSegments(type) {
    return ROUTES[type].map((id, i) => ({ el: byId(id), dur: SEGMENT_MS[i] }));
  }

  const WEB_COLOR = '#e2e8f0';
  const WEB_EVERY = 1400;
  let lastWebSpawn = 0;

  let timelineIndex = -1;
  let lastSpawn = 0;
  let typeCursor = 0;
  const t0 = performance.now();

  function tick(now) {
    const elapsed = (now - t0) % CYCLE;

    let index = 0;
    TIMELINE.forEach((entry, i) => {
      if (elapsed >= entry.start) index = i;
    });

    if (index !== timelineIndex) {
      timelineIndex = index;
      svg.dataset.phase = TIMELINE[index].phase;
      lastSpawn = now;
    }

    const phase = TIMELINE[index].phase;
    if (now - lastSpawn >= SPAWN_EVERY[phase]) {
      lastSpawn = now;
      if (phase === 'check') {
        const health = byId('p-health');
        launch(COLORS.health, [
          { el: health, dur: 600 },
          { el: health, dur: 600, reverse: true }
        ], 6);
      } else if (phase === 'online') {
        const type = EVENT_TYPES[typeCursor++ % EVENT_TYPES.length];
        launch(COLORS[type], eventSegments(type));
      } else {
        launch(COLORS.local, [{ el: byId('p-desk-local'), dur: 800 }], 7);
      }
    }

    // Web requests run in every phase: request goes out, response comes back
    if (now - lastWebSpawn >= WEB_EVERY) {
      lastWebSpawn = now;
      launch(WEB_COLOR, [
        { el: byId('p-web-app'), dur: 500 },
        { el: byId('p-web-gql'), dur: 500 },
        { el: byId('p-web-db'), dur: 500 },
        { el: byId('p-web-db'), dur: 500, reverse: true },
        { el: byId('p-web-gql'), dur: 500, reverse: true },
        { el: byId('p-web-app'), dur: 500, reverse: true }
      ], 6);
    }

    movePackets(now);
    requestAnimationFrame(tick);
  }

  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    svg.dataset.phase = 'online';
  } else {
    requestAnimationFrame(tick);
  }
})();
</script>

</body>
</html>
